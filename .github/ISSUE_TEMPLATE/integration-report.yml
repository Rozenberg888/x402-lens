name: Integration report
description: Tell us what broke when you integrated x402-lens (or what worked).
title: "Integration: "
labels: ["integration"]
body:
  - type: markdown
    attributes:
      value: |
        Real failure modes from outside the project are how this package gets better.
        Paste as much as you can — a challenge JSON and a finding code beat a screenshot.
  - type: input
    id: package
    attributes:
      label: Package
      description: What did you install?
      placeholder: "@x402-lens/express"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Express 4
        - Express 5
        - Other / CLI only
    validations:
      required: true
  - type: input
    id: facilitator
    attributes:
      label: Facilitator
      description: URL or product name (x402.org, CDP, self-hosted, …)
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected vs actual. Include finding codes if you have them.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal route config, env vars (redact keys), CLI command.
    validations:
      required: false
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: Challenge / payment / verify / settle JSON, or `x402-lens explain --json` output.
    validations:
      required: false

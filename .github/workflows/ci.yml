name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that races a newer one should not keep a runner busy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / Express ${{ matrix.express }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        express: ["4", "5"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The peer range allows Express 4 and 5, but CI would otherwise only ever
      # exercise whatever the lockfile happens to pin, so a regression that only
      # appears on the other major would ship silently.
      - name: Pin Express ${{ matrix.express }}
        run: npm install --no-save --no-audit --no-fund express@${{ matrix.express }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catch the live.yml failure mode early: package exports point at dist/,
      # and test:live must still resolve @x402-lens/* via aliases without build.
      - name: Guard live vitest package resolution
        run: npx vitest run --config vitest.config.ts test/meta.ci-guards.test.ts

      - name: Build
        run: npm run build

      # `tsup` emits CJS but the test suite only imports sources, so a broken
      # CommonJS entry point would never surface. Load it for real.
      - name: Smoke-test the built entry points
        run: node scripts/smoke-dist.mjs

  packaging:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Catches a manifest that forgets `dist` or leaks sources: `npm pack`
      # respects `files`, so this is what users would actually receive.
      - name: Check tarball contents
        run: node scripts/check-package-contents.mjs
